# K3s Cluster Inventory Configuration
# Copy this file to ../inventory.conf and edit with your values.
#
# All IP addresses must match DHCP static leases configured on your
# DHCP server. See docs/03-network-planning.md for details.
#
# CONFIGURATION SOURCE
# --------------------
# Deployment scripts look for pre-generated config files in the generated/
# directory before falling back to inline generation from this inventory.
#
# Pre-generated configs can be produced by:
#   1. python3 generate.py                (from variables.yaml)
#   2. Web UI ZIP extraction:             unzip k3s-config-*.zip -d generated/
#      (download from https://opentreecz.github.io/k3s/)
#
# When pre-generated configs are present, the scripts use them directly.
# When they are absent, the scripts generate configs inline from this file.
# Override the config directory: CONFIG_DIR=/path/to/configs ./scripts/01-configure-os.sh

# ==============================================================================
# OPERATING SYSTEM CHOICE
# ==============================================================================
# Options: "sle-micro" or "microos"
OS_DISTRIBUTION="microos"

# SLE Micro registration code (required only if OS_DISTRIBUTION="sle-micro")
SLE_REGISTRATION_CODE=""
SLE_REGISTRATION_EMAIL=""

# ==============================================================================
# NETWORK CONFIGURATION
# ==============================================================================
# Virtual IP for the K3s API (managed by Keepalived)
# This IP must also have a static DHCP reservation or be outside DHCP range
K3S_VIP_IPV4="192.168.1.100"
K3S_VIP_IPV6="fd00::100"

# Network interface used on all nodes (must be consistent)
NETWORK_INTERFACE="eth0"

# DNS domain for the cluster
CLUSTER_DOMAIN="k3s.local"

# ==============================================================================
# MASTER NODES (Control Plane)
# ==============================================================================
# Format: HOSTNAME IPv4 IPv6 MAC_ADDRESS
MASTER_NODES=(
    "master-01 192.168.1.101 fd00::101 aa:bb:cc:dd:ee:01"
    "master-02 192.168.1.102 fd00::102 aa:bb:cc:dd:ee:02"
    "master-03 192.168.1.103 fd00::103 aa:bb:cc:dd:ee:03"
)

# ==============================================================================
# WORKER NODES
# ==============================================================================
# Format: HOSTNAME IPv4 IPv6 MAC_ADDRESS
WORKER_NODES=(
    "worker-01 192.168.1.111 fd00::111 aa:bb:cc:dd:ee:11"
    "worker-02 192.168.1.112 fd00::112 aa:bb:cc:dd:ee:12"
    "worker-03 192.168.1.113 fd00::113 aa:bb:cc:dd:ee:13"
)

# ==============================================================================
# K3S CONFIGURATION
# ==============================================================================
# K3s version to install (leave empty for latest stable)
K3S_VERSION=""

# K3s token (will be auto-generated if left empty)
K3S_TOKEN=""

# K3s API server port
K3S_API_PORT="6443"

# HAProxy frontend port (clients connect here)
HAPROXY_FRONTEND_PORT="6443"

# HAProxy stats port
HAPROXY_STATS_PORT="8404"

# Disable default components (comma-separated): traefik,servicelb,local-storage
K3S_DISABLE="traefik,servicelb"

# Cluster CIDR ranges
K3S_CLUSTER_CIDR="10.42.0.0/16"
K3S_SERVICE_CIDR="10.43.0.0/16"
K3S_CLUSTER_CIDR_V6="fd42::/48"
K3S_SERVICE_CIDR_V6="fd43::/112"

# ==============================================================================
# SSH CONFIGURATION
# ==============================================================================
SSH_USER="root"
SSH_KEY_PATH="$HOME/.ssh/id_ed25519"
SSH_PORT="22"

# ==============================================================================
# HAPROXY / KEEPALIVED
# ==============================================================================
# Keepalived virtual router ID (must be unique on your L2 segment)
KEEPALIVED_ROUTER_ID="51"

# Keepalived authentication password
KEEPALIVED_AUTH_PASS="K3sHA2024"
