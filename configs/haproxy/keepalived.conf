! Keepalived configuration for K3s API VIP
! Deploy to /etc/keepalived/keepalived.conf on all master nodes
!
! IMPORTANT: Adjust "state" and "priority" per node:
!   master-01: state MASTER, priority 101
!   master-02: state BACKUP, priority 100
!   master-03: state BACKUP, priority 99
!
! Adjust "interface" to match your network interface name.
! Adjust "virtual_router_id" to be unique on your L2 segment.
! Adjust "auth_pass" to a secure password.

global_defs {
    router_id K3S_APISERVER
    script_user root
    enable_script_security
}

vrrp_script check_haproxy {
    script "/usr/bin/killall -0 haproxy"
    interval 2
    weight 2
    fall 3
    rise 2
}

vrrp_instance K3S_VIP {
    ! Set to MASTER on master-01, BACKUP on others
    state MASTER
    interface eth0
    virtual_router_id 51
    ! Set priority: 101 for master-01, 100 for master-02, 99 for master-03
    priority 101
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass K3sHA2024
    }

    virtual_ipaddress {
        192.168.1.100/24 dev eth0
        fd00::100/64 dev eth0
    }

    track_script {
        check_haproxy
    }
}
