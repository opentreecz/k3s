# K3s API Server Load Balancer
# Deploy to /etc/haproxy/haproxy.cfg on all master nodes
#
# This configuration is auto-generated by scripts/02-install-haproxy.sh
# but is provided here as a reference.

global
    log         /dev/log local0
    log         /dev/log local1 notice
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/lib/haproxy/stats

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    option                  redispatch
    retries                 3
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout check           10s
    maxconn                 3000

#---------------------------------------------------------------------
# Statistics - accessible at http://<master-ip>:8404/stats
#---------------------------------------------------------------------
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin

#---------------------------------------------------------------------
# K3s API Server Frontend
#---------------------------------------------------------------------
frontend k3s_api_frontend
    bind *:6443
    mode tcp
    option tcplog
    default_backend k3s_api_backend

#---------------------------------------------------------------------
# K3s API Server Backend
# Adjust server lines to match your inventory
#---------------------------------------------------------------------
backend k3s_api_backend
    mode tcp
    option tcp-check
    balance roundrobin
    default-server inter 10s downinter 5s rise 2 fall 2 slowstart 60s maxconn 250 maxqueue 256 weight 100

    server master-01 192.168.1.101:6443 check
    server master-02 192.168.1.102:6443 check
    server master-03 192.168.1.103:6443 check
