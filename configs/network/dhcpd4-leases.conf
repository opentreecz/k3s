# ISC DHCP Server - DHCPv4 Static Leases for K3s Cluster
# Include this file in your dhcpd.conf:
#   include "/etc/dhcp/k3s-leases.conf";
#
# IMPORTANT: Replace MAC addresses with actual values from your hardware.
# See docs/03-network-planning.md for details.

group k3s-cluster {
    option domain-name "k3s.local";
    option domain-name-servers 192.168.1.1;
    option routers 192.168.1.1;
    default-lease-time 86400;
    max-lease-time 604800;

    # =========================================================================
    # Master Nodes (Control Plane + HAProxy)
    # =========================================================================
    host master-01 {
        hardware ethernet aa:bb:cc:dd:ee:01;
        fixed-address 192.168.1.101;
        option host-name "master-01";
    }

    host master-02 {
        hardware ethernet aa:bb:cc:dd:ee:02;
        fixed-address 192.168.1.102;
        option host-name "master-02";
    }

    host master-03 {
        hardware ethernet aa:bb:cc:dd:ee:03;
        fixed-address 192.168.1.103;
        option host-name "master-03";
    }

    # =========================================================================
    # Worker Nodes
    # =========================================================================
    host worker-01 {
        hardware ethernet aa:bb:cc:dd:ee:11;
        fixed-address 192.168.1.111;
        option host-name "worker-01";
    }

    host worker-02 {
        hardware ethernet aa:bb:cc:dd:ee:12;
        fixed-address 192.168.1.112;
        option host-name "worker-02";
    }

    host worker-03 {
        hardware ethernet aa:bb:cc:dd:ee:13;
        fixed-address 192.168.1.113;
        option host-name "worker-03";
    }
}

# =========================================================================
# VIP Reservation
# Reserve the VIP address to prevent it from being assigned dynamically.
# This is a "dummy" host entry - no real MAC needed.
# Alternatively, exclude this IP from your DHCP pool range.
# =========================================================================
host k3s-vip-reservation {
    hardware ethernet 00:00:00:00:00:00;
    fixed-address 192.168.1.100;
    option host-name "k3s-api";
}
