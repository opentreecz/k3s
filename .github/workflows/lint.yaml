---
name: Lint and Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Python Linting (ruff)
  # ===========================================================================
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

  # ===========================================================================
  # YAML Linting (yamllint)
  # ===========================================================================
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yaml \
            variables.yaml \
            configs/k3s/*.yaml

  # ===========================================================================
  # Configuration File Linting (custom linter)
  # ===========================================================================
  config-lint:
    name: Config File Lint (conf/cfg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jinja2

      - name: Lint existing config files
        run: python3 lint_configs.py --path configs

  # ===========================================================================
  # Template Generation and Validation
  # ===========================================================================
  generate-validate:
    name: Generate and Validate Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate configurations (dry-run)
        run: python3 generate.py --dry-run

      - name: Generate configurations
        run: python3 generate.py --clean

      - name: Lint generated config files
        run: python3 lint_configs.py --path generated

      - name: Lint generated YAML files
        run: |
          pip install yamllint
          find generated -name "*.yaml" -o -name "*.yml" | \
            xargs -r yamllint -c .yamllint.yaml

  # ===========================================================================
  # Shell Script Linting (shellcheck)
  # ===========================================================================
  shell-lint:
    name: Shell Script Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: |
          shellcheck --source-path=scripts -x scripts/*.sh

  # ===========================================================================
  # Web Code Validation (HTML, JS syntax)
  # ===========================================================================
  web-validate:
    name: Web Code Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/templates.js

      - name: Validate HTML structure
        run: |
          # Check that index.html is well-formed (basic checks)
          python3 -c "
          import html.parser, sys

          class Checker(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  pass
              def handle_endtag(self, tag):
                  pass

          with open('web/index.html') as f:
              content = f.read()
          parser = Checker()
          parser.feed(content)
          print('HTML parsing: OK')
          "

      - name: Verify template keys match
        run: |
          # Ensure templates.js defines expected template keys
          python3 -c "
          import re, sys

          with open('web/templates.js') as f:
              content = f.read()

          # Extract template keys
          keys = re.findall(r'\"([^\"]+)\":\s*\x60', content)
          print(f'Found {len(keys)} templates: {keys}')

          required = [
              'haproxy/haproxy.cfg',
              'keepalived.conf',
              'k3s-server.yaml',
              'k3s-agent.yaml',
              'network/dhcpd4-leases.conf',
              'network/hosts',
              'os/sysctl-k3s.conf',
              'variables.yaml',
              'network/router-checklist.md',
          ]
          missing = [k for k in required if k not in keys]
          if missing:
              print(f'ERROR: Missing templates: {missing}')
              sys.exit(1)
          print('All required templates present.')
          "
