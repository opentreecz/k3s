---
name: Lint and Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Python Linting (ruff)
  # ===========================================================================
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

  # ===========================================================================
  # YAML Linting (yamllint)
  # ===========================================================================
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yaml \
            variables.yaml \
            configs/k3s/*.yaml

  # ===========================================================================
  # Configuration File Linting (custom linter)
  # ===========================================================================
  config-lint:
    name: Config File Lint (conf/cfg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml jinja2

      - name: Lint existing config files
        run: python3 lint_configs.py --path configs

  # ===========================================================================
  # Template Generation and Validation
  # ===========================================================================
  generate-validate:
    name: Generate and Validate Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate configurations (dry-run)
        run: python3 generate.py --dry-run

      - name: Generate configurations
        run: python3 generate.py --clean

      - name: Lint generated config files
        run: python3 lint_configs.py --path generated

      - name: Lint generated YAML files
        run: |
          pip install yamllint
          find generated -name "*.yaml" -o -name "*.yml" | \
            xargs -r yamllint -c .yamllint.yaml

  # ===========================================================================
  # Shell Script Linting (shellcheck)
  # ===========================================================================
  shell-lint:
    name: Shell Script Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts
        run: |
          shellcheck --source-path=scripts -x scripts/*.sh
